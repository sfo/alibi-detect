[project]
name = "alibi-detect"
version = "0.13.0"
description = "Algorithms for outlier detection, concept drift and metrics."
readme = "README.md"
authors = [
    {name = "Seldon Technologies Ltd.", email = "hello@seldon.io"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "Pillow>=5.4.1, <11.0.0",
    "catalogue>=2.0.0, <3.0.0",
    "dill>=0.3.0, <0.4.0",
    "matplotlib>=3.0.0, <4.0.0",
    "numba>=0.50.0, !=0.54.0",
    "numpy>=2.0.0",
    "opencv-python>=3.2.0, <5.0.0",
    "pandas>=1.0.0, <3.0.0",
    "pydantic>=1.8.0, <3.0.0",
    "requests>=2.21.0, <3.0.0",
    "scikit-image>=0.24, <0.26.0",
    "scikit-learn>=1.6.0, <2.0.0",
    "scipy>=1.5.0, <2.0.0",
    "toml>=0.10.1, <1.0.0",
    "tqdm>=4.28.1, <5.0.0",
    "transformers>=4.0.0, <4.52.0",
    "typing-extensions>=3.7.4.3",
]
license = {text = "Business Source License 1.1"}

[project.urls]
Homepage = "https://github.com/SeldonIO/alibi-detect"

[project.optional-dependencies]
prophet = [
    "prophet>=1.1.0, <2.0.0",
]
torch = [
    "torch>=1.7.0, <3.0.0",
]
tensorflow = [
    "tensorflow>=2.16.0, <2.21.0",
    "tensorflow_probability>=0.8.0, <0.26.0",
    "tf-keras>=2.16.0, <2.21.0",
]
keops = [
    "pykeops>=2.0.0, <2.3.0",
    "torch>=1.7.0, <3.0.0",
]
all = [
    "prophet>=1.1.0, <2.0.0",
    "pykeops>=2.0.0, <2.3.0",
    "tensorflow>=2.16.0, <2.21.0",
    "tensorflow_probability>=0.8.0, <0.26.0",
    "tf-keras>=2.16.0, <2.21.0",
    "torch>=1.7.0, <3.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "alibi-detect[all]",
    "alibi-testing",
    "ipykernel>=5.1.0,<7.0.0",
    "ipywidgets>=7.6.5,<9.0.0",
    "jupytext>=1.12.0,<2.0.0",
    "mypy>=1.0,<2.0",
    "nbconvert>=6.0.7,<8.0.0",
    "packaging>=19.0,<24.0",
    "pre-commit>=1.20.0,<4.0.0",
    "pytest>=5.3.5,<8.0.0",
    "pytest-cases>=3.6.8,<4.0.0",
    "pytest-cov>=2.6.1,<5.0.0",
    "pytest-custom-exit-code>=0.3.0",
    "pytest-randomly>=3.5.0,<4.0.0",
    "pytest-timeout>=1.4.2,<3.0.0",
    "pytest-xdist>=1.28.0,<4.0.0",
    "tox>=3.21.0,<5.0.0",
    "twine>3.2.0,<5.0.0",
    "types-requests>=2.25,<3.0",
    "types-toml>=0.10,<1.0",
    "xgboost>=1.3.2,<3.0.0",
]
doc = [
    "ipykernel>=5.1.0,<7.0.0",
    "ipython>=7.2.0,<9.0.0",
    "matplotlib>=3.0.0,<4.0.0",
    "myst-parser>=1.0,<3.0",
    "nbsphinx>=0.8.5,<0.10.0",
    "numpy>=2.0.0",
    "pandas>=1.0.0,<3.0.0",
    "sphinx>=4.2.0,<8.2.0",
    "sphinx-autodoc-typehints>=1.12.0,<2.6.0",
    "sphinx-design==0.6.1",
    "sphinx-rtd-theme>=1.0.0,<3.1.0",
    "sphinxcontrib-apidoc>=0.3.0,<0.6.0",
    "sphinxcontrib-bibtex>=2.1.0,<3.0.0",
    "typing-extensions>=3.7.4.3",
]

[tool.uv.sources]
alibi-testing = { git = "https://github.com/SeldonIO/alibi-testing", rev = "master" }
alibi-detect = { workspace = true }
